# SimVP old-region sanity run: original South Atlantic crop, v4 raw memmap.
# Keeps the old hourly target schedule from configs/simvp.yaml, but avoids the
# slow per-sample NetCDF path.
experiment:
  name: SimVP-OldRegion-v4-sanity
model:
  type: SimVP
  params:
    in_shape: [12, 69, 32, 64]
data:
  dataset_version: v4
  cut: [[36, 68], [125, 189]]
  include_target: false
  lead_time: 0
  interval: 1
  muti_target_steps: 1
  start_time_x: 0
  end_time_x: 11
  start_time_y: 12
  end_time_y: 23
  num_workers: 8
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 4
  train:
    start_time: "2000-01-01 00:00:00"
    end_time: "2003-12-30 00:00:00"
    batch_size: 32
    shuffle: true
  val:
    start_time: "2004-01-01 00:00:00"
    end_time: "2004-12-30 00:00:00"
    batch_size: 32
    shuffle: false
  memmap_path: null
training:
  litmodel: mutiout_f
  lr: 5e-4
  eta_min: 0.0
  max_epoch: 20
  loss_type: MAE
  early_stopping_patience: 5
  extra_kwargs:
    muti_out_nums: 6
    time_prediction: 6
trainer:
  precision: 32
  log_every_n_steps: 5
  static_graph: true
  num_sanity_val_steps: 0
  float32_matmul_precision: high
logging:
  checkpoint_base: "${WEATHERPRED_CHECKPOINT_BASE:-./checkpoints}"
  comet_project: "${COMET_PROJECT_NAME:-WeatherPredictions}"
  log_code_file: null
