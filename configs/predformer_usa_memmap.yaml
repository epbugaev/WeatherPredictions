# Production PredFormer-USA config that reads from the packed memmap built
# by ``tools/repack_era5.py``. Mirror of configs/predformer_usa.yaml; only
# the ``data`` block differs: ``dataset_version: v3_memmap`` plus the
# ``memmap_path`` pointing at the canonical artefact. Submit scripts that
# stage the memmap to local NVMe set ``MEMMAP_PATH_OVERRIDE`` in env —
# ``train.build_dataset`` picks it up and redirects reads to the staged copy.

experiment:
  name: PredFormer-USA-Memmap

model:
  type: PredFormer
  params:
    height: 32
    width: 64
    num_channels: 69
    pre_seq: 12
    after_seq: 12
    patch_size: 8
    dim: 256
    heads: 8
    dim_head: 32
    dropout: 0.0
    attn_dropout: 0.0
    drop_path: 0.0
    scale_dim: 4
    depth: 1
    Ndepth: 24
    path_to_constants: "${WEATHERBENCH_ROOT:-/home/fratnikov/weather_bench}/1.40625deg/constants/constants_1.40625deg.nc"
    cut: [[75, 107], [164, 228]]

data:
  dataset_version: v3_memmap
  memmap_path: null
  cut: [[75, 107], [164, 228]]
  include_target: false
  lead_time: 0
  sample_stride: 1
  frame_interval: 1
  muti_target_steps: 1
  start_time_x: 0
  end_time_x: 11
  start_time_y: 12
  end_time_y: 23
  # 4 workers/rank (down from 8): with v3_memmap the per-sample cost is
  # essentially a page-cache read, so more workers stop helping while they
  # still consume one resource_sharer socket each. 8 + persistent_workers
  # leaked sockets over time and made pin_memory_loop crash with
  # ``FileNotFoundError`` after ~3 epochs (job 3990403).
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  train:
    start_time: "2000-01-01 00:00:00"
    end_time: "2003-12-30 00:00:00"
    batch_size: 90
    shuffle: true
  val:
    start_time: "2004-01-01 00:00:00"
    end_time: "2004-12-30 00:00:00"
    batch_size: 90
    shuffle: false

training:
  litmodel: mutiout_f
  lr: 0.0005
  eta_min: 0.0
  max_epoch: 20
  loss_type: MAE
  early_stopping_patience: 5
  extra_kwargs:
    muti_out_nums: 6

trainer:
  precision: 32
  log_every_n_steps: 50
  static_graph: true
  num_sanity_val_steps: 0
  float32_matmul_precision: high

logging:
  checkpoint_base: "${WEATHERPRED_CHECKPOINT_BASE:-./checkpoints}"
  comet_project: "${COMET_PROJECT_NAME:-WeatherPredictions}"
  log_code_file: null
