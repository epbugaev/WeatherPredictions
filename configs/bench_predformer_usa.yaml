# Bench config for dataloader profiling.
# Same model/data block as configs/predformer_usa.yaml; differences:
#   - max_epoch=1, log_every_n_steps=1000 (silenced), early_stopping disabled;
#   - val date range trimmed to two weeks (val_loader is not actually iterated
#     in bench mode but the dataset object is still constructed).
# Paired with the BENCH_MAX_STEPS env var read by trainer.py for a hard
# step-count cap and with PROFILE_TRACE_DIR to dump a torch.profiler trace.

experiment:
  name: bench-PredFormer-USA

model:
  type: PredFormer
  params:
    height: 32
    width: 64
    num_channels: 69
    pre_seq: 12
    after_seq: 12
    patch_size: 8
    dim: 256
    heads: 8
    dim_head: 32
    dropout: 0.0
    attn_dropout: 0.0
    drop_path: 0.0
    scale_dim: 4
    depth: 1
    Ndepth: 24
    path_to_constants: /home/fratnikov/weather_bench/1.40625deg/constants/constants_1.40625deg.nc
    cut: [[75, 107], [164, 228]]

data:
  dataset_version: v3
  cut: [[75, 107], [164, 228]]
  include_target: false
  lead_time: 1
  interval: 1
  muti_target_steps: 1
  start_time_x: 0
  end_time_x: 11
  start_time_y: 12
  end_time_y: 23
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  train:
    start_time: "2000-01-01 00:00:00"
    end_time: "2003-12-30 00:00:00"
    batch_size: 32
    shuffle: true
  val:
    start_time: "2004-01-01 00:00:00"
    end_time: "2004-01-15 00:00:00"
    batch_size: 32
    shuffle: false

training:
  litmodel: mutiout_f
  lr: 0.0005
  eta_min: 0.0
  max_epoch: 1
  loss_type: MAE
  early_stopping_patience: 1000
  extra_kwargs:
    muti_out_nums: 6

trainer:
  precision: 32
  log_every_n_steps: 1000
  static_graph: true
  num_sanity_val_steps: 0
  float32_matmul_precision: high

logging:
  checkpoint_base: /home/fa.buzaev/WeatherPredictions/checkpoints/
  comet_project: WeatherPredictions
  log_code_file: null
