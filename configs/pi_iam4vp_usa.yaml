experiment:
  name: PI-IAM4VP-USA

model:
  type: PI-IAM4VP
  params: {}

data:
  dataset_version: v3
  cut: [[75, 107], [164, 228]]
  include_target: false
  lead_time: 1
  interval: 1
  muti_target_steps: 1
  start_time_x: 0
  end_time_x: 5
  start_time_y: 6
  end_time_y: 11
  num_workers: 4
  pin_memory: true
  train:
    start_time: "2000-01-01 00:00:00"
    end_time: "2000-02-15 00:00:00"
    batch_size: 4
    shuffle: true
  val:
    start_time: "2000-02-16 00:00:00"
    end_time: "2000-02-25 00:00:00"
    batch_size: 4
    shuffle: false

training:
  litmodel: mutiout_imvp_small_world
  lr: 5.0e-4
  eta_min: 0.0
  max_epoch: 1
  loss_type: MAE
  early_stopping_patience: 5
  extra_kwargs:
    muti_out_nums: 6
    time_prediction: 6

trainer:
  precision: 32
  log_every_n_steps: 5
  # PI-IAM4VP uses iterative manual backward (training_strategies/iterative_manual.py);
  # parameters are activated incrementally per timestep, so static_graph=True from
  # the production templates breaks DDP. Disable both static_graph and rely on
  # find_unused_parameters=True so DDP tolerates the per-iter graph change.
  static_graph: false
  find_unused_parameters: true
  num_sanity_val_steps: 0
  float32_matmul_precision: high

logging:
  checkpoint_base: /home/fa.buzaev/WeatherPredictions/checkpoints/
  comet_project: WeatherPredictions
  log_code_file: null
