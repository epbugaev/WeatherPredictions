# Production PredFormer-USA config that uses the v4 dataset:
# raw memmap reads + normalisation in the trainer via
# ``utils.normalize.WeatherNormalize``. Same memmap artefact as
# ``predformer_usa_memmap.yaml``; only the dataset version changes.

experiment:
  name: PredFormer-USA-v4

model:
  type: PredFormer
  params:
    height: 32
    width: 64
    num_channels: 69
    pre_seq: 12
    after_seq: 12
    patch_size: 8
    dim: 256
    heads: 8
    dim_head: 32
    dropout: 0.0
    attn_dropout: 0.0
    drop_path: 0.0
    scale_dim: 4
    depth: 1
    Ndepth: 24
    path_to_constants: /home/fratnikov/weather_bench/1.40625deg/constants/constants_1.40625deg.nc
    cut: [[75, 107], [164, 228]]

data:
  dataset_version: v4
  memmap_path: /home/fa.buzaev/era5_memmap/predformer_usa_2000_2004.dat
  cut: [[75, 107], [164, 228]]
  include_target: false
  lead_time: 1
  interval: 1
  muti_target_steps: 1
  start_time_x: 0
  end_time_x: 11
  start_time_y: 12
  end_time_y: 23
  # 8 workers / rank × 2 ranks = 16 workers, paired with
  # --cpus-per-task=32 (16 CPU/rank). At batch=144 the per-batch
  # collate (torch.stack of 144 (12,69,32,64) tensors) is non-trivial;
  # 4 workers throughput-capped batch=144 to 30 samples/sec.
  num_workers: 8
  # pin_memory + persistent_workers=False: PyTorch's pin_memory thread
  # leaks sockets across epochs, crashing at epoch ~5 (job 3990855:
  # "Pin memory thread exited unexpectedly"). Disabling pin_memory entirely
  # (job 3990956) dropped GPU util from 78% to 58% — bad. Recreating
  # workers each epoch resets the cumulative leak; cost is ~30-60 sec/epoch
  # startup, acceptable.
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 4
  train:
    # bf16 freed ~30 GB of activation memory (was 74 GB at batch=90 fp32,
    # 46 GB at batch=90 bf16). Bumped 90 -> 144 (+60%) to convert that
    # headroom into wall-time. Expected memory at batch=144 ≈ 73 GB,
    # leaving ~12 GB safety margin on the 85 GB A100.
    start_time: "2000-01-01 00:00:00"
    end_time: "2003-12-30 00:00:00"
    batch_size: 144
    shuffle: true
  val:
    start_time: "2004-01-01 00:00:00"
    end_time: "2004-12-30 00:00:00"
    batch_size: 144
    shuffle: false

training:
  litmodel: mutiout_f
  lr: 0.0005
  eta_min: 0.0
  max_epoch: 20
  loss_type: MAE
  early_stopping_patience: 5
  extra_kwargs:
    muti_out_nums: 6

trainer:
  precision: bf16
  log_every_n_steps: 50
  static_graph: true
  num_sanity_val_steps: 0
  float32_matmul_precision: high
  # bf16 has fp32's dynamic range but reduced precision; gradient
  # explosion via attention/softmax outliers is still possible on long
  # runs. clip at 1.0 keeps the optimiser in well-conditioned territory.
  grad_clip_norm: 1.0
  # Skip backward+step on NaN/Inf loss (one bad sample shouldn't poison
  # the rest of training). Default-on; left explicit to document intent.
  skip_non_finite_loss: true

logging:
  checkpoint_base: /home/fa.buzaev/WeatherPredictions/checkpoints/
  comet_project: WeatherPredictions
  log_code_file: null
