# Production PredFormer-USA config that uses the v4 dataset:
# raw memmap reads + normalisation in the trainer via
# ``utils.normalize.WeatherNormalize``. Same memmap artefact as
# ``predformer_usa_memmap.yaml``; only the dataset version changes.

experiment:
  name: PredFormer-USA-v4

model:
  type: PredFormer
  params:
    height: 32
    width: 64
    num_channels: 69
    pre_seq: 12
    after_seq: 12
    patch_size: 8
    dim: 256
    heads: 8
    dim_head: 32
    dropout: 0.0
    attn_dropout: 0.0
    # Job 3991633 overfit hard from epoch ~41 (val 0.187 -> 0.210,
    # train 0.187 -> 0.111 — train kept improving while val drifted).
    # Stochastic depth at 0.15 across the 24 attention blocks delays
    # the overfit and lets the model train longer productively.
    drop_path: 0.15
    scale_dim: 4
    depth: 1
    Ndepth: 24
    path_to_constants: /home/fratnikov/weather_bench/1.40625deg/constants/constants_1.40625deg.nc
    cut: [[75, 107], [164, 228]]

data:
  dataset_version: v4
  memmap_path: /home/fa.buzaev/era5_memmap/predformer_usa_2000_2004.dat
  cut: [[75, 107], [164, 228]]
  include_target: false
  lead_time: 1
  interval: 1
  muti_target_steps: 1
  start_time_x: 0
  end_time_x: 11
  start_time_y: 12
  end_time_y: 23
  # 8 workers / rank × 2 ranks = 16 workers, paired with
  # --cpus-per-task=32 (16 CPU/rank). At batch=144 the per-batch
  # collate (torch.stack of 144 (12,69,32,64) tensors) is non-trivial;
  # 4 workers throughput-capped batch=144 to 30 samples/sec.
  num_workers: 8
  # In-thread pin_memory experiment (commit 16fcb6c) regressed GPU util
  # 73% -> 52% — pin_memory() in the hot loop allocated a 50 MB pinned
  # buffer per tensor per batch and blocked the trainer for ~30 ms/step
  # (≈30% of the bf16 100 ms step). Revert to the previous "honest"
  # compromise: pin_memory=true (async H2D via PyTorch's pin_memory
  # thread) + persistent_workers=false (worker pool restarts each epoch
  # to reset the cumulative socket leak that crashed job 3990855 at
  # epoch 5). Cost ~30-60 s/epoch startup, far less than the +30 ms/step
  # regression.
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 4
  train:
    # bf16 freed ~30 GB of activation memory (was 74 GB at batch=90 fp32,
    # 46 GB at batch=90 bf16). Bumped 90 -> 144 (+60%) to convert that
    # headroom into wall-time. Expected memory at batch=144 ≈ 73 GB,
    # leaving ~12 GB safety margin on the 85 GB A100.
    start_time: "2000-01-01 00:00:00"
    end_time: "2003-12-30 00:00:00"
    batch_size: 144
    shuffle: true
  val:
    start_time: "2004-01-01 00:00:00"
    end_time: "2004-12-30 00:00:00"
    batch_size: 144
    shuffle: false

training:
  litmodel: mutiout_f
  lr: 0.0005
  eta_min: 0.0
  max_epoch: 2000
  loss_type: MAE
  # Without warmup, batch=144 + lr=0.0005 + bf16 produced non-monotonic
  # training: val_loss=0.5707 on epoch 1 then jumped to 0.624 and never
  # recovered (job 3991270). Linear warmup over the first 5% of total
  # steps (≈100 epochs at max_epoch=2000) lets the optimiser ease into
  # the cosine schedule.
  warmup_ratio: 0.05
  warmup_start_factor: 0.001
  # patience scaled to validation cadence below: val_every_n_epochs=3
  # means each "patience tick" is 3 epochs of plateau. 34*3 = 102 epoch
  # plateau (≈ the previous 100-epoch budget on every-epoch validation).
  early_stopping_patience: 34
  extra_kwargs:
    muti_out_nums: 6

trainer:
  precision: bf16
  log_every_n_steps: 50
  static_graph: true
  num_sanity_val_steps: 0
  float32_matmul_precision: high
  # bf16 has fp32's dynamic range but reduced precision; gradient
  # explosion via attention/softmax outliers is still possible on long
  # runs. clip at 1.0 keeps the optimiser in well-conditioned territory.
  grad_clip_norm: 1.0
  # Skip backward+step on NaN/Inf loss (one bad sample shouldn't poison
  # the rest of training). Default-on; left explicit to document intent.
  skip_non_finite_loss: true
  # Validate (and write checkpoints) only every 3rd epoch — each val
  # pass + ckpt write + DDP barrier eats ~30-60 s/epoch otherwise.
  # early_stopping_patience above is scaled to match (34*3 ≈ 100 epochs
  # of plateau).
  val_every_n_epochs: 3

logging:
  checkpoint_base: /home/fa.buzaev/WeatherPredictions/checkpoints/
  comet_project: WeatherPredictions
  log_code_file: null
