experiment:
  name: PredFormer

model:
  type: PredFormer
  params:
    height: 128
    width: 256
    num_channels: 69
    pre_seq: 12
    after_seq: 12
    patch_size: 8
    dim: 256
    heads: 8
    dim_head: 32
    dropout: 0.0
    attn_dropout: 0.0
    drop_path: 0.0
    scale_dim: 4
    depth: 1
    Ndepth: 24
    path_to_constants: /home/fratnikov/weather_bench/1.40625deg/constants/constants_1.40625deg.nc

data:
  dataset_version: v1
  include_target: false
  lead_time: 1
  interval: 12
  muti_target_steps: 23
  num_workers: 4
  train:
    start_time: "2000-01-01 00:00:00"
    end_time: "2003-12-25 00:00:00"
    batch_size: 8
    shuffle: true
  val:
    start_time: "2004-01-01 00:00:00"
    end_time: "2004-12-25 00:00:00"
    batch_size: 8
    shuffle: false

training:
  litmodel: mutiout_f
  lr: 5e-4
  eta_min: 0.0
  max_epoch: 20
  loss_type: MAE
  early_stopping_patience: 5
  extra_kwargs:
    muti_out_nums: 6

trainer:
  precision: 32
  log_every_n_steps: 5
  static_graph: true

logging:
  checkpoint_base: /home/fa.buzaev/WeatherPredictions/checkpoints/
  comet_project: WeatherPredictions
  log_code_file: null
