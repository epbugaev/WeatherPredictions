# Production PredFormer-USA config for the v5 pipeline:
#   * dataset_version: v5 (same raw memmap as v4, marker class)
#   * trainer.cuda_prefetcher: true (background thread + side CUDA stream
#     overlap CPU→GPU copies and normalisation with forward+backward)
#   * data.pin_memory: false (PyTorch's leaking pin_memory thread is NOT
#     spawned — the prefetcher does the pinning itself, so persistent
#     workers are safe to leave on)
#   * data.persistent_workers: true (saves ~30-60 s/epoch on worker
#     pool restarts that v4 had to pay)
# Everything else (model, batch=148, warmup, drop_path=0.15,
# val_every_n_epochs=3, async ckpt) is identical to predformer_usa_v4.yaml
# so the v4↔v5 A/B comparison isolates the prefetcher contribution.

experiment:
  name: PredFormer-USA-v5

model:
  type: PredFormer
  params:
    height: 32
    width: 64
    num_channels: 69
    pre_seq: 12
    after_seq: 12
    patch_size: 8
    dim: 256
    heads: 8
    dim_head: 32
    dropout: 0.0
    attn_dropout: 0.0
    drop_path: 0.15
    scale_dim: 4
    depth: 1
    Ndepth: 24
    path_to_constants: /home/fratnikov/weather_bench/1.40625deg/constants/constants_1.40625deg.nc
    cut: [[75, 107], [164, 228]]

data:
  dataset_version: v5
  memmap_path: /home/fa.buzaev/era5_memmap/predformer_usa_2000_2004.dat
  cut: [[75, 107], [164, 228]]
  include_target: false
  lead_time: 1
  interval: 1
  muti_target_steps: 1
  start_time_x: 0
  end_time_x: 11
  start_time_y: 12
  end_time_y: 23
  num_workers: 8
  # pin_memory=False: PyTorch does NOT spawn its leaking pin_memory
  # background thread. The CudaPrefetcher pins each batch itself in its
  # own background thread (cudaHostRegister releases the GIL, so it
  # doesn't block the main trainer) and issues async H2D copies on a
  # side stream.
  pin_memory: false
  persistent_workers: true
  prefetch_factor: 4
  train:
    start_time: "2000-01-01 00:00:00"
    end_time: "2003-12-30 00:00:00"
    batch_size: 148
    shuffle: true
  val:
    start_time: "2004-01-01 00:00:00"
    end_time: "2004-12-30 00:00:00"
    batch_size: 148
    shuffle: false

training:
  litmodel: mutiout_f
  lr: 0.0005
  eta_min: 0.0
  max_epoch: 2000
  loss_type: MAE
  warmup_ratio: 0.05
  warmup_start_factor: 0.001
  early_stopping_patience: 34
  extra_kwargs:
    muti_out_nums: 6

trainer:
  precision: bf16
  log_every_n_steps: 50
  static_graph: true
  num_sanity_val_steps: 0
  float32_matmul_precision: high
  grad_clip_norm: 1.0
  skip_non_finite_loss: true
  val_every_n_epochs: 3
  cuda_prefetcher: true
  cuda_prefetcher_depth: 2

logging:
  checkpoint_base: /home/fa.buzaev/WeatherPredictions/checkpoints/
  comet_project: WeatherPredictions
  log_code_file: null
