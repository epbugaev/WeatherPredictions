# PI-IAM4VP-USA-v4-72h: v4 raw-memmap (WeatherNormalize in trainer) + 72h horizon.
# farthest target = (end_time_y-end_time_x)*interval + lead_time = 72h.
# Models/strategies unchanged; only the data block differs vs *_usa_train.yaml.
experiment:
  name: PI-IAM4VP-USA-v4-72h
model:
  type: PI-IAM4VP
  params: {}
data:
  dataset_version: v4
  cut:
  - - 75
    - 107
  - - 164
    - 228
  include_target: false
  lead_time: 0
  interval: 12
  muti_target_steps: 1
  start_time_x: 0
  end_time_x: 5
  start_time_y: 6
  end_time_y: 11
  num_workers: 8
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 4
  train:
    start_time: '2000-01-01 00:00:00'
    end_time: '2003-12-30 00:00:00'
    batch_size: 16
    shuffle: true
  val:
    start_time: '2004-01-01 00:00:00'
    end_time: '2004-12-30 00:00:00'
    batch_size: 16
    shuffle: false
  memmap_path: /home/fa.buzaev/era5_memmap/predformer_usa_2000_2004.dat
training:
  litmodel: mutiout_imvp_small_world
  lr: 0.0005
  eta_min: 0.0
  max_epoch: 20
  loss_type: MAE
  early_stopping_patience: 5
  extra_kwargs:
    muti_out_nums: 6
    time_prediction: 6
trainer:
  precision: 32
  log_every_n_steps: 50
  static_graph: false
  find_unused_parameters: true
  num_sanity_val_steps: 0
  float32_matmul_precision: high
logging:
  checkpoint_base: /home/fa.buzaev/WeatherPredictions/checkpoints/
  comet_project: WeatherPredictions
  log_code_file: null
