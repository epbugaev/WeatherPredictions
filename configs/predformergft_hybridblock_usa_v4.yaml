# PredFormerGFT-HybridBlock-USA-v4-72h: v4 raw-memmap (WeatherNormalize in trainer) + 72h horizon.
# farthest target = (end_time_y-end_time_x)*interval + lead_time = 72h.
# Models/strategies unchanged; only the data block differs vs *_usa_train.yaml.
experiment:
  name: PredFormerGFT-HybridBlock-USA-v4-72h
model:
  type: PredFormerGFT_HybridBlock
  params:
    height: 32
    width: 64
    num_channels: 69
    pre_seq: 12
    after_seq: 12
    patch_size: 8
    dim: 256
    heads: 6
    dim_head: 32
    dropout: 0.0
    attn_dropout: 0.0
    drop_path: 0.0
    scale_dim: 4
    depth: 2
    Ndepth: 18
    path_to_constants: /home/fratnikov/weather_bench/1.40625deg/constants/constants_1.40625deg.nc
    cut: [[75, 107], [164, 228]]
data:
  dataset_version: v4
  cut:
  - - 75
    - 107
  - - 164
    - 228
  include_target: false
  lead_time: 0
  interval: 6
  muti_target_steps: 1
  start_time_x: 0
  end_time_x: 11
  start_time_y: 12
  end_time_y: 23
  num_workers: 8
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 4
  train:
    start_time: '2000-01-01 00:00:00'
    end_time: '2003-12-30 00:00:00'
    batch_size: 8
    shuffle: true
  val:
    start_time: '2004-01-01 00:00:00'
    end_time: '2004-12-30 00:00:00'
    batch_size: 8
    shuffle: false
  memmap_path: /home/ebugaev/era5_memmap/predformer_usa_2000_2004.dat
training:
  litmodel: mutiout_f
  lr: 0.0001
  eta_min: 0.0
  max_epoch: 2000
  loss_type: MAE
  early_stopping_patience: 34
  extra_kwargs:
    muti_out_nums: 6
  warmup_ratio: 0.05
  warmup_start_factor: 0.001
trainer:
  precision: 32
  log_every_n_steps: 50
  static_graph: true
  num_sanity_val_steps: 0
  float32_matmul_precision: high
  val_every_n_epochs: 3
logging:
  checkpoint_base: /home/ebugaev/checkpoints/
  comet_project: WeatherPredictions
  log_code_file: null
