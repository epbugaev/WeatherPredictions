# Production PredFormer config for the FULL GLOBE on 5.625deg resolution.
# Mirrors predformer_usa_v4.yaml (raw memmap dataset + WeatherNormalize in
# the trainer) with three differences:
#   * grid 32x64 (5.625deg) covers the entire globe instead of a USA crop;
#   * memmap_path points at the globe memmap built by
#     ``sh_files/repack_era5_globe.sh`` (2000-2018, ~95 GB);
#   * cut is removed — the dataset reads the full grid.
# Channels (69), normalisation (mean_std.json), tokeniser (patch_size=8),
# attention layout and training schedule stay identical to the USA config
# so direct ablation is possible.

experiment:
  name: PredFormer-Globe-v4

model:
  type: PredFormer
  params:
    height: 32
    width: 64
    num_channels: 69
    pre_seq: 12
    after_seq: 12
    patch_size: 8
    dim: 256
    heads: 8
    dim_head: 32
    dropout: 0.0
    attn_dropout: 0.0
    drop_path: 0.0
    scale_dim: 4
    depth: 1
    Ndepth: 24
    path_to_constants: /home/fratnikov/weather_bench/5.625deg/constants/constants_5.625deg.nc
    # No cut: the constants file is already on the 32x64 globe grid.

data:
  dataset_version: v4
  # Built by sh_files/repack_era5_globe.sh (full-globe 32x64, 2000-2018).
  memmap_path: /home/ebugaev/era5_memmap/predformer_globe_2000_2018.dat
  # No cut — full globe.
  include_target: false
  lead_time: 1
  interval: 1
  muti_target_steps: 1
  start_time_x: 0
  end_time_x: 11
  start_time_y: 12
  end_time_y: 23
  num_workers: 8
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 4
  train:
    # 2000-2017 inclusive train (18 yrs), 2018 val.
    start_time: "2000-01-01 00:00:00"
    end_time: "2017-12-30 00:00:00"
    batch_size: 144
    shuffle: true
  val:
    start_time: "2018-01-01 00:00:00"
    end_time: "2018-12-30 00:00:00"
    batch_size: 144
    shuffle: false

training:
  litmodel: mutiout_f
  lr: 0.0005
  eta_min: 0.0
  max_epoch: 2000
  loss_type: MAE
  # Same warmup recipe as predformer_usa_v4.yaml — keeps batch=144 + bf16
  # stable on the bigger dataset (18 train years vs 4).
  warmup_ratio: 0.05
  warmup_start_factor: 0.001
  early_stopping_patience: 100
  extra_kwargs:
    muti_out_nums: 6

trainer:
  precision: bf16
  log_every_n_steps: 50
  static_graph: true
  num_sanity_val_steps: 0
  float32_matmul_precision: high
  grad_clip_norm: 1.0
  skip_non_finite_loss: true

logging:
  checkpoint_base: /home/ebugaev/checkpoints/
  comet_project: WeatherPredictions
  log_code_file: null
